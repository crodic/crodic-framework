services:
  # ==============================================================================
  # Backend API (NestJS)
  # ==============================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: crodic_api
    restart: unless-stopped
    env_file:
      - path: apps/api/.env
        required: false
    ports:
      - "${API_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ==============================================================================
  # Web Portal / Admin (Vite + React + Nginx)
  # ==============================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    container_name: crodic_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - app-network

  # ==============================================================================
  # Client Website (Next.js SSR)
  # ==============================================================================
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      target: production
    container_name: crodic_client
    restart: unless-stopped
    env_file:
      - path: apps/client/.env
        required: false
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - app-network

  # ==============================================================================
  # Infrastructure Services (Bound to 127.0.0.1 on host for security)
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: crodic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monorepo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: crodic_redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  minio:
    image: pgsty/silo:latest
    container_name: crodic_minio
    restart: unless-stopped
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network

  minio-init:
    image: pgsty/mc:latest
    container_name: crodic_minio_init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_HOST: ${MINIO_HOST:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_S3_BUCKET: ${AWS_DEFAULT_S3_BUCKET:-nest-uploads}
      AWS_PRIVATE_BUCKET: ${AWS_PRIVATE_BUCKET:-nest-uploads-private}
    volumes:
      - ./docker/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  api_storage:

networks:
  app-network:
    driver: bridge
