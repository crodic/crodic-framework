name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      skip_migration:
        description: "Skip running database migrations"
        required: false
        default: false
        type: boolean
      rebuild_all:
        description: "Force rebuild all Docker images (api, web, client)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API quality and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: boilerplate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boilerplate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter api lint

      - name: Type check API
        run: pnpm --filter api check-types

      - name: Unit tests API
        run: pnpm --filter api test:ci

      - name: E2E tests API
        run: pnpm --filter api test:e2e

      - name: Build API
        run: pnpm --filter api build

  web:
    name: Web quality and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality check shared packages
        run: |
          pnpm --filter @repo/query-builder lint
          pnpm --filter @repo/query-builder check-types
          pnpm --filter @repo/query-builder test

      - name: Lint web
        run: pnpm --filter web lint

      - name: Type check web
        run: pnpm --filter web check-types

      - name: Test web with coverage
        run: pnpm --filter web test:coverage

      - name: Build web
        run: pnpm --filter web build

      - name: Verify web build output
        run: test -d apps/web/dist && test -f apps/web/dist/index.html

      - name: Upload web coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: ignore

  client:
    name: Client quality and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint client
        run: pnpm --filter client lint

      - name: Type check client
        run: pnpm --filter client check-types

      - name: Test client
        run: pnpm --filter client test:ci

      - name: Build client
        run: pnpm --filter client build

  deploy:
    name: Deploy Monorepo to VPS
    needs: [api, web, client]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Execute Deployment Script
        run: |
          set -e
          cd /var/www/crodic-framework
          git checkout main
          PREV_SHA="$(git rev-parse HEAD 2>/dev/null || echo '')"
          git pull origin main
          chmod +x scripts/deploy.sh

          DEPLOY_FLAGS="--skip-pull"
          if [ -n "$PREV_SHA" ]; then
            DEPLOY_FLAGS="$DEPLOY_FLAGS --changed-from $PREV_SHA"
          fi
          if [ "${{ inputs.skip_migration }}" = "true" ]; then
            DEPLOY_FLAGS="$DEPLOY_FLAGS --skip-migration"
          fi
          if [ "${{ inputs.rebuild_all }}" = "true" ]; then
            DEPLOY_FLAGS="$DEPLOY_FLAGS --all"
          fi

          ./scripts/deploy.sh $DEPLOY_FLAGS
