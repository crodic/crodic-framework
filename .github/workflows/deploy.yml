name: Deploy to Production (VPS)

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      skip_migration:
        description: "Skip running database migrations"
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Monorepo to VPS
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: self-hosted

    steps:
      - name: Execute Deployment Script
        run: |
          set -e
          cd /var/www/crodic-framework
          git checkout main
          git pull origin main
          chmod +x scripts/deploy.sh

          DEPLOY_FLAGS=""
          if [ "${{ inputs.skip_migration }}" = "true" ]; then
            DEPLOY_FLAGS="--skip-migration"
          fi

          ./scripts/deploy.sh $DEPLOY_FLAGS
