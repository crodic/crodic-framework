name: Deploy to Production (VPS)

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      skip_migration:
        description: "Skip running database migrations"
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Monorepo to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/var/www/crodic-framework' }}"
            echo "Navigating to deploy directory: $DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Check if deploy.sh exists
            if [ ! -f "scripts/deploy.sh" ]; then
              echo "Error: scripts/deploy.sh not found in $DEPLOY_DIR"
              exit 1
            fi

            chmod +x scripts/deploy.sh

            DEPLOY_FLAGS=""
            if [ "${{ inputs.skip_migration }}" = "true" ]; then
              DEPLOY_FLAGS="--skip-migration"
            fi

            ./scripts/deploy.sh $DEPLOY_FLAGS
